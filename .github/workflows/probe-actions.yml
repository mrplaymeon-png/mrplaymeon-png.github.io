name: GitHub-Actions-Statusprobe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-actions.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Letzte Workflow-Läufe abfragen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p status
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs?per_page=40" \
            | jq '{checked_at:(now|todate),runs:[.workflow_runs[]|{id,name,event,status,conclusion,head_sha,run_started_at,updated_at,html_url}]}' \
            > status/workflow-runs.json
      - name: Ergebnis speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/workflow-runs.json
          git commit -m 'Konfliktfreien Actions-Status speichern'
          git pull --rebase origin main
          git push origin main

