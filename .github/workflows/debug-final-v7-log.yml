name: V7-Finalfehler gezielt auslesen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-final-v7-log.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fehlgeschlagenes Jobprotokoll auslesen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_ID: '89823502585'
        run: |
          mkdir -p /tmp/v7-log status
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/v7-log/job.log
          {
            echo '=== Fehlerzeilen ==='
            grep -n -E 'Error:|Timeout|failed|intercepts pointer|pageerror|requestfailed|HTTP-Fehler|##\[error\]' /tmp/v7-log/job.log | tail -n 120 || true
            echo
            echo '=== Letzte 240 Zeilen ==='
            tail -n 240 /tmp/v7-log/job.log
          } > status/final-v7-debug.txt

      - name: Diagnose speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/final-v7-debug.txt
          git commit -m 'Aktuellen V7-Finalfehler speichern'
          git pull --rebase origin main
          git push origin main
