name: V7-Fotoebene einmalig reparieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v7-photo-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Untere Navigation als oberste Körperebene einsetzen
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/build-v7-real-images.mjs';
          let source = fs.readFileSync(file, 'utf8');
          function replaceOnce(before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: erwartet 1 Treffer, gefunden ${count}`);
            source = source.replace(before, after);
          }
          replaceOnce(
            "  let pending=false;function enhance(){pending=false;enhanceHome();enhanceQuestion();enhanceSpecies();enhancePractice();enhanceComponents();}",
            "  function liftNavigation(){const nav=document.querySelector('.bottom');if(nav&&nav.parentElement!==document.body){document.body.appendChild(nav);}if(nav){nav.style.setProperty('position','fixed','important');nav.style.setProperty('z-index','2147483647','important');nav.style.setProperty('pointer-events','auto','important');}}\n  let pending=false;function enhance(){pending=false;liftNavigation();enhanceHome();enhanceQuestion();enhanceSpecies();enhancePractice();enhanceComponents();}",
            'Navigation an body verschieben'
          );
          fs.writeFileSync(file, source);
          NODE

      - name: Änderung speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-v7-real-images.mjs
          git commit -m 'V7-Navigation als oberste Ebene dauerhaft fixieren'
          git pull --rebase origin main
          git push origin main
