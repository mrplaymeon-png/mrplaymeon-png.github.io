name: V7-Fotoebene einmalig reparieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v7-photo-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fotos lassen Navigationsklicks zuverlässig durch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/build-v7-real-images.mjs';
          let source = fs.readFileSync(file, 'utf8');
          function replaceOnce(before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: erwartet 1 Treffer, gefunden ${count}`);
            source = source.replace(before, after);
          }
          replaceOnce(
            '.real-photo-card{position:relative;z-index:0;margin:',
            '.real-photo-card{position:relative;z-index:0;pointer-events:none;margin:',
            'Fotokarte klickdurchlässig'
          );
          replaceOnce(
            '.real-photo-caption{display:flex;',
            '.real-photo-caption{pointer-events:auto;display:flex;',
            'Quellenzeile anklickbar'
          );
          replaceOnce(
            '.real-photo-caption a{color:',
            '.real-photo-caption a{pointer-events:auto;color:',
            'Quellenlink anklickbar'
          );
          fs.writeFileSync(file, source);
          NODE

      - name: Änderung speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-v7-real-images.mjs
          git commit -m 'V7-Fotokarten blockieren die Navigation nicht mehr'
          git pull --rebase origin main
          git push origin main
