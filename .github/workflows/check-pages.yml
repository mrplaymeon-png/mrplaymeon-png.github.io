name: PetriCoach Pages pruefen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Pages pruefen und bei Bedarf aktivieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          API="https://api.github.com/repos/${REPOSITORY}/pages"
          HEADERS=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10")

          BEFORE_CODE=$(curl -sS -o /tmp/pages-before.json -w "%{http_code}" "${HEADERS[@]}" "$API")
          CREATE_CODE="not-needed"

          if [ "$BEFORE_CODE" = "404" ]; then
            CREATE_CODE=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST "${HEADERS[@]}" "$API" -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          else
            printf '%s\n' '{}' > /tmp/pages-create.json
          fi

          sleep 15
          AFTER_CODE=$(curl -sS -o /tmp/pages-after.json -w "%{http_code}" "${HEADERS[@]}" "$API")

          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "before_http=$BEFORE_CODE"
            echo "create_http=$CREATE_CODE"
            echo "after_http=$AFTER_CODE"
            echo ""
            echo "after_response:"
            cat /tmp/pages-after.json
            echo ""
            echo "create_response:"
            cat /tmp/pages-create.json
          } > pages-status.txt

      - name: Pruefergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "GitHub Pages Status pruefen"
          git push
