name: V7-Praxisfoto sichtbar machen

on:
  push:
    branches: [main]
    paths:
      - 'v7-practice-photo-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Praxisfoto aus dem eingeklappten Diagramm herausnehmen
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/build-v7-real-images.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const before = "diagram?diagram.prepend(photo):card.insertBefore(photo,card.children[1]||null)";
          const after = "diagram?diagram.before(photo):card.insertBefore(photo,card.children[1]||null)";
          if (source.includes(after)) {
            console.log('Praxisfoto ist bereits sichtbar platziert.');
          } else {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`Praxisfoto-Platzierung: erwartet 1 Treffer, gefunden ${count}`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source, 'utf8');
            console.log('Praxisfoto wird nun als sichtbares Kartenelement vor dem aufklappbaren Diagramm platziert.');
          }
          fs.writeFileSync('v7-final-trigger.txt', `practice-photo-fixed-${new Date().toISOString()}\n`, 'utf8');
          NODE

      - name: Korrektur veroeffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-v7-real-images.mjs v7-final-trigger.txt
          git commit -m 'Praxisfotos dauerhaft sichtbar halten und V7 neu bauen'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            if [ "$attempt" = "5" ]; then exit 1; fi
            sleep $((attempt * 3))
          done
