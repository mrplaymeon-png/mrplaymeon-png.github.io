name: PetriCoach V6 live im Browser testen

on:
  push:
    branches: [main]
    paths:
      - 'v6/index.html'
      - 'v6/sw.js'
      - 'v6/manifest.webmanifest'
      - '.github/workflows/verify-v6-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Warten, bis GitHub Pages exakt V6 ausliefert
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mrplaymeon-png.github.io/v6/?verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL" || true)
            bytes=$(wc -c < /tmp/live.html 2>/dev/null || echo 0)
            echo "Versuch ${attempt}: HTTP ${code}, ${bytes} Bytes"
            if [ "$code" = "200" ] \
              && grep -q 'PetriCoach NRW' /tmp/live.html \
              && grep -q '180 Fragen' /tmp/live.html \
              && grep -q 'Version 6.0' /tmp/live.html \
              && ! grep -q 'Failed to Decode Data' /tmp/live.html \
              && ! grep -q 'DecompressionStream' /tmp/live.html; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo 'GitHub Pages liefert V6 noch nicht korrekt aus.' >&2
            exit 1
          fi
          echo "$URL" > /tmp/live-url.txt
          sha256sum /tmp/live.html

      - name: Selenium und Browser-Test vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: App wirklich anklicken und Lernbild prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          url = Path('/tmp/live-url.txt').read_text().strip()
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=390,844')
          options.add_argument('--disable-cache')

          driver = webdriver.Chrome(options=options)
          errors = []
          try:
            driver.get(url)
            wait = WebDriverWait(driver, 30)
            wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-start="guided"]')))
            body = driver.find_element(By.TAG_NAME, 'body').text
            assert 'PetriCoach NRW' in body
            assert 'Failed to Decode Data' not in body
            assert len(driver.find_elements(By.CSS_SELECTOR, 'button')) >= 20

            driver.find_element(By.CSS_SELECTOR, '[data-start="guided"]').click()
            wait.until(EC.visibility_of_element_located((By.ID, 'quizView')))
            answers = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, '#answers .answer'))
            assert len(answers) == 3

            found_visual = False
            for index in range(3):
              current = driver.find_elements(By.CSS_SELECTOR, '#answers .answer')
              if index >= len(current):
                break
              try:
                if current[index].is_enabled():
                  current[index].click()
                  time.sleep(0.4)
              except Exception:
                pass
              if driver.find_elements(By.CSS_SELECTOR, '.learning-visual svg'):
                found_visual = True
                break
            assert found_visual, 'Nach der richtig gelösten Antwort erschien kein Lernbild.'
            assert driver.find_element(By.ID, 'nextBtn').is_displayed()

            result = {
              'status': 'ok',
              'url': url,
              'title': driver.title,
              'buttons': len(driver.find_elements(By.CSS_SELECTOR, 'button')),
              'answers': len(driver.find_elements(By.CSS_SELECTOR, '#answers .answer')),
              'learning_visual': found_visual,
              'failed_decode_text': 'Failed to Decode Data' in driver.page_source,
              'page_source_sha256': hashlib.sha256(driver.page_source.encode('utf-8')).hexdigest(),
              'tested_viewport': '390x844',
            }
            Path('v6/live-test.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
            driver.save_screenshot('v6/live-test-mobile.png')
          finally:
            driver.quit()
          PY

      - name: Live-Prüfergebnis speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v6/live-test.json v6/live-test-mobile.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'PetriCoach V6 live auf mobilem Browser geprüft'
          git push
